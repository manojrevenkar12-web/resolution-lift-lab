      de: ["{greet_de} die {integration} integration synchronisiert nicht mehr",
           "{integration} verbindung neu einrichten, daten fehlen"]
    export_data:
      difficulty: 0.2
      en: ["{greet_en} how do i export all my data as csv",
           "need to export our contacts before we cancel {urgency_en}",
           "{greet_en} the export button gives an empty file"]
      de: ["{greet_de} wie exportiere ich alle daten als csv",
           "export liefert eine leere datei {urgency_de}"]
    add_seats:
      difficulty: 0.0
      en: ["{greet_en} how do i add more seats for new teammates on the {plan}",
