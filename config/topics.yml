# The topics customers write about, by vertical. Each topic is one help-centre article.
# Templates are filled with the slot values below; `{x}` picks a random value of slot x.
# Topics inside a vertical deliberately share words (refund vs return, password vs 2FA), so
# clustering is not trivial. German templates are used by workspaces whose language is de.
# difficulty: how hard the question is for an AI agent even with a good article (logit scale).
slots:
  greet_en: ["hi", "hello", "hey there", "", "", "good morning"]
  greet_de: ["hallo", "guten tag", "hi", "", ""]
  urgency_en: ["", "", "asap please", "this is urgent", "thanks in advance", "help!"]
  urgency_de: ["", "", "bitte schnell", "dringend", "danke im voraus"]
  order: ["#48213", "order 99812", "my last order", "the order from monday", "order no 77120"]
  bestellung: ["#48213", "bestellung 99812", "meine letzte bestellung", "die bestellung von montag"]
  plan: ["pro plan", "team plan", "starter plan", "annual plan", "business tier"]
  tarif: ["pro tarif", "team tarif", "jahresabo", "business tarif"]
  card: ["visa", "mastercard", "credit card", "debit card", "amex"]
  karte: ["visa karte", "mastercard", "kreditkarte", "debitkarte"]
  amount: ["49 eur", "12.99", "200 euros", "the full amount", "350"]
  integration: ["slack", "salesforce", "hubspot", "zapier", "the api"]
verticals:
  saas:
    reset_password:
      difficulty: 0.0
      en: ["{greet_en} i forgot my password and the reset email never arrives {urgency_en}",
           "{greet_en} how do i reset my password, the link says expired",
           "cant log in, password reset not working {urgency_en}"]
      de: ["{greet_de} ich habe mein passwort vergessen und die reset mail kommt nicht {urgency_de}",
           "passwort zurücksetzen geht nicht, link abgelaufen"]
    two_factor:
      difficulty: 0.4
      en: ["{greet_en} i lost my phone and cant get the 2fa code to log in {urgency_en}",
           "two factor authentication code not accepted, how do i log in",
           "{greet_en} need to reset 2fa, new phone, locked out of my account"]
      de: ["{greet_de} neues handy, der 2fa code wird nicht akzeptiert und ich komme nicht rein",
           "zwei faktor code funktioniert nicht {urgency_de}"]
    change_plan:
      difficulty: 0.1
      en: ["{greet_en} how can i upgrade from the {plan} to a bigger plan",
           "want to downgrade my {plan}, where do i change it {urgency_en}",
           "{greet_en} switch plan to {plan} mid month, will i be charged"]
      de: ["{greet_de} wie wechsle ich vom {tarif} in einen anderen tarif",
           "ich möchte mein {tarif} kündigen oder herabstufen"]
    invoice_copy:
      difficulty: -0.2
      en: ["{greet_en} where can i download my invoice for last month",
           "need a copy of the invoice with our vat number {urgency_en}",
           "{greet_en} invoice shows the wrong company address, can i get a new one"]
      de: ["{greet_de} wo finde ich die rechnung vom letzten monat",
           "rechnung mit ust id benötigt {urgency_de}"]
    api_rate_limit:
      difficulty: 0.9
      en: ["{greet_en} we keep getting 429 errors from {integration}, what is the rate limit",
           "api calls failing with too many requests since this morning {urgency_en}",
           "{greet_en} how do i raise the api rate limit for our account"]
      de: ["{greet_de} wir bekommen ständig 429 fehler von {integration}",
           "api limit erhöhen, zu viele anfragen fehler"]
    integration_sync:
      difficulty: 0.7
      en: ["{greet_en} the {integration} integration stopped syncing contacts {urgency_en}",
           "data is not syncing to {integration} anymore, how do i reconnect",
